name: Daily LinkedIn internships

on:
  schedule:
    - cron: "30 0,12 * * *"   # 06:00 and 18:00 IST (00:30 / 12:30 UTC)
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      test_email:
        description: "Only send a test email (skip the LinkedIn search)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch internships and email digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONUNBUFFERED: "1"
        run: python agent.py ${{ inputs.test_email && '--test-email' || '' }}
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.test_email
        with:
          name: internships
          path: output/
          retention-days: 30
