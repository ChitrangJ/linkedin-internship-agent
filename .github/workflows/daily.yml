name: Daily LinkedIn internships

on:
  # Started at 05:35 and 17:35 IST by a Claude scheduled task (GitHub's own
  # schedule ran 6-8 hours late). You can also run it from the Actions tab.
  workflow_dispatch:
    inputs:
      test_email:
        description: "Only send a test email (skip the LinkedIn search)"
        type: boolean
        default: false
      hours:
        description: "Catch-up: look back this many hours instead of 12 (e.g. 17). Empty = default"
        type: string
        default: ""
      only:
        description: "Preview: only these locations, comma separated (e.g. Paris, Lyon). Empty = all"
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch internships and email digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONUNBUFFERED: "1"
          ONLY: ${{ inputs.only }}
          HOURS: ${{ inputs.hours }}
        run: python agent.py ${{ inputs.test_email && '--test-email' || '' }} ${{ inputs.only && '--only "$ONLY"' || '' }} ${{ inputs.hours && '--hours "$HOURS"' || '' }}
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.test_email
        with:
          name: internships
          path: output/
          retention-days: 30
